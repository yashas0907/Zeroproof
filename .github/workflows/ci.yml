name: CI

on:
  push:
    branches: [main, develop, java-migration]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Java backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install ZKP bridge dependencies
        run: npm ci
      - name: Install Tesseract runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libtesseract-dev
      - name: Test
        run: cd backend && ./mvnw -B test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run build
