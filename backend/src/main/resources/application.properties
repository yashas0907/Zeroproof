server.port=${PORT:3000}
spring.application.name=zeroproof
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.url=jdbc:h2:file:${ZEROPROOF_DATA_DIR:../data}/java/zeroproof
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.default-property-inclusion=non_null

zeroproof.data-dir=${ZEROPROOF_DATA_DIR:../data}
zeroproof.keys-dir=${ZEROPROOF_KEYS_DIR:../keys}
zeroproof.cors-origin=${ZEROPROOF_CORS_ORIGIN:http://localhost:5173}
zeroproof.rate-limit=${ZEROPROOF_RATE_LIMIT:100}
zeroproof.node-command=${ZEROPROOF_NODE:node}
zeroproof.bridge-script=${ZEROPROOF_BRIDGE:../zkp/zk-bridge.js}
zeroproof.tessdata-dir=${ZEROPROOF_TESSDATA:..}
zeroproof.import-legacy=${ZEROPROOF_IMPORT_LEGACY:false}
# AEGISID_DOC_KEY (64 hex chars) overrides the persistent local key file.
zeroproof.doc-key=${AEGISID_DOC_KEY:}
